services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: novavida
      POSTGRES_USER: novavida
      POSTGRES_PASSWORD: novavida
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novavida -d novavida"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: >
      sh -c "python manage.py makemigrations cadastro &&
             python manage.py migrate &&
             python manage.py popular_dados &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DATABASE_URL: postgres://novavida:novavida@db:5432/novavida
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados_postgres:
