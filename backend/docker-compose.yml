services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: novavida
      POSTGRES_USER: novavida
      POSTGRES_PASSWORD: novavida
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novavida -d novavida"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      DATABASE_URL: postgres://novavida:novavida@db:5432/novavida
      DJANGO_DEBUG: "1"
      ADMIN_USUARIO: admin
      ADMIN_SENHA: admin12345
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados_postgres:
