# Hospedagem no Render: sistema Django (Docker) + banco PostgreSQL.
services:
  - type: web
    name: nova-vida-pendotiba
    runtime: docker
    plan: free
    region: virginia
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nova-vida-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: ADMIN_USUARIO
        sync: false
      - key: ADMIN_SENHA
        sync: false

databases:
  - name: nova-vida-db
    plan: free
    region: virginia
    databaseName: novavida
    user: novavida
